version: '3'

services:
  music-tag-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: music-tag-web:local
    container_name: music-tag-web-local
    ports:
      - "8001:8001"
    environment:
      dockerrun: "yes"
      DJANGO_SECRET_KEY: "local-dev-secret-key-123456"
      GUNICORN_WORKER_NUM: 1
      WRITE_WORKER_NUM: 4
    volumes:
      - ./media:/app/media:rw
      - ./data:/app/data:rw
    restart: unless-stopped
